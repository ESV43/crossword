<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IISER TVM Crossword</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 16px;
    min-height: 100vh;
    background: linear-gradient(135deg, #eef0f7 0%, #f7f3ec 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #1c1c1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  h1 {
    font-size: 21px;
    font-weight: 800;
    text-align: center;
    margin: 4px 0 4px;
    letter-spacing: 0.3px;
    background: linear-gradient(90deg, #534ab7, #0f6e56, #993c1d);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #subtitle {
    font-size: 12.5px;
    color: #6b6a65;
    margin-bottom: 16px;
    text-align: center;
  }
  #board-wrap {
    width: 100%;
    max-width: 480px;
    overflow-x: auto;
    display: flex;
    justify-content: center;
    padding: 6px 0 10px;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(12, minmax(26px, 8vw));
    grid-template-rows: repeat(12, minmax(26px, 8vw));
    gap: 3px;
    background: #1c1c1a;
    padding: 4px;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
  }
  .cell {
    position: relative;
    background: #fff;
    border-radius: 4px;
    transition: background 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
  }
  .cell input {
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    text-transform: uppercase;
    color: #1c1c1a;
    border-radius: 4px;
    padding: 0;
    caret-color: #534ab7;
  }
  .cell.active {
    background: #dfe6ff;
    transform: scale(1.06);
    box-shadow: 0 0 0 2px #7f77dd;
    z-index: 2;
  }
  .cell.filled input {
    animation: pop 0.18s ease;
  }
  @keyframes pop {
    0% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  .cell.correct {
    background: #d7f3de;
    animation: flashGreen 0.5s ease;
  }
  .cell.correct input { color: #1c6b3a; }
  @keyframes flashGreen {
    0% { background: #97e0ab; transform: scale(1.15); }
    100% { background: #d7f3de; transform: scale(1); }
  }
  .cell.wrong {
    background: #fbdada;
    animation: shake 0.35s ease;
  }
  .cell.wrong input { color: #a32d2d; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }
  .num {
    position: absolute;
    top: 1px;
    left: 2px;
    font-size: 11px;
    font-weight: 800;
    color: #3c3489;
    pointer-events: none;
    line-height: 1;
  }
</style>
</head>
<body>


<div id="board-wrap"><div id="grid"></div></div>



<script>
const answers = {
  1: { word: "IISERTVMLOGO", dir: "down",   row: 1, col: 6,
       clue: "This official emblem represents IISER Thiruvananthapuram's identity" },
  2: { word: "PADMANABHA",   dir: "down",   row: 3, col: 9,
       clue: "Deity after whom the city of Thiruvananthapuram is named" },
  3: { word: "CRUCIBLE",     dir: "across", row: 9, col: 0,
       clue: "A container used to heat substances to very high temperatures in a lab" },
  4: { word: "TESSYTHOMAS",  dir: "across", row: 6, col: 1,
       clue: "Indian scientist known as the 'Missile Woman', led India's Agni missile program" },
  5: { word: "ANVESHA",      dir: "across", row: 4, col: 3,
       clue: "Annual science and technology fest of IISER Thiruvananthapuram" }
};

const words = [];
const cellMap = {};
for (const num in answers) {
  const a = answers[num];
  const cells = [];
  for (let i = 0; i < a.word.length; i++) {
    const r = a.dir === "down" ? a.row + i : a.row;
    const c = a.dir === "across" ? a.col + i : a.col;
    const key = r + "_" + c;
    cells.push(key);
    if (!cellMap[key]) { cellMap[key] = { letter: a.word[i], starts: [], wordIds: [] }; }
    cellMap[key].wordIds.push(words.length);
    if (i === 0) cellMap[key].starts.push(num);
  }
  words.push({ num: Number(num), dir: a.dir, cells: cells });
}

const gridEl = document.getElementById("grid");
const inputs = {};
const cellEls = {};
let currentWord = null;

for (let r = 1; r <= 12; r++) {
  for (let c = 0; c < 12; c++) {
    const key = r + "_" + c;
    if (!cellMap[key]) continue;

    const wrap = document.createElement("div");
    wrap.className = "cell";
    wrap.style.gridRow = r;
    wrap.style.gridColumn = c + 1;

    const inp = document.createElement("input");
    inp.maxLength = 1;
    inp.autocomplete = "off";
    inp.autocapitalize = "characters";
    inp.dataset.key = key;

    inp.addEventListener("focus", () => {
      document.querySelectorAll(".cell.active").forEach(el => el.classList.remove("active"));
      wrap.classList.add("active");
      pickWordForCell(key);
    });

    inp.addEventListener("click", () => {
      const wIds = cellMap[key].wordIds;
      if (wIds.length > 1) {
        const idx = wIds.indexOf(currentWord);
        currentWord = wIds[(idx + 1) % wIds.length];
      }
    });

    inp.addEventListener("input", (e) => {
      e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, "");
      wrap.classList.remove("correct", "wrong");
      if (e.target.value) {
        wrap.classList.add("filled");
        setTimeout(() => wrap.classList.remove("filled"), 200);
        moveInWord(key, 1);
      }
    });

    inp.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !e.target.value) {
        moveInWord(key, -1);
      }
    });

    wrap.appendChild(inp);

    if (cellMap[key].starts.length) {
      const num = document.createElement("span");
      num.className = "num";
      num.textContent = cellMap[key].starts[0];
      wrap.appendChild(num);
    }

    gridEl.appendChild(wrap);
    inputs[key] = inp;
    cellEls[key] = wrap;
  }
}

function pickWordForCell(key) {
  const wIds = cellMap[key].wordIds;
  if (wIds.includes(currentWord)) return;
  currentWord = wIds[0];
}

function moveInWord(key, step) {
  if (currentWord === null) return;
  const w = words[currentWord];
  const pos = w.cells.indexOf(key);
  let next = pos + step;
  if (step > 0) {
    while (next < w.cells.length && inputs[w.cells[next]].value) next++;
  }
  if (next >= 0 && next < w.cells.length) {
    inputs[w.cells[next]].focus();
  }
}



</script>

</body>
</html>
